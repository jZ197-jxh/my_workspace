<style>
:root{--red:#E74C3C;--red-light:#FF6B6B;--red-dark:#C0392B;--red-bg:#FFF5F5;--red-bg2:#FFE8E8;--text:#2D2D2D;--text2:#666;--text3:#999;--white:#FFF;--border:#FFD6D6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--red-bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8px}
.widget{background:var(--white);border-radius:18px;border:1.5px solid var(--border);width:100%;max-width:360px;box-shadow:0 4px 16px rgba(231,76,60,.1);overflow:hidden;display:flex;flex-direction:column;max-height:90vh}
.header{background:linear-gradient(135deg,var(--red),var(--red-light));color:var(--white);padding:14px 16px 12px;position:relative}
.header::after{content:'🌟';position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.6}
.date-row{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.date-main{font-size:22px;font-weight:700;letter-spacing:-0.3px}
.d-badge{background:rgba(255,255,255,.25);padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.date-sub{font-size:11px;opacity:.85;margin-top:2px}
.task-list{flex:1;overflow-y:auto;padding:10px 12px 8px}
.task-item{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:8px;transition:all .2s;cursor:pointer}
.task-item:hover{background:var(--red-bg)}
.task-item.checked .task-text{opacity:.4;text-decoration:line-through}
.task-emoji{font-size:18px;flex-shrink:0;width:22px;text-align:center}
.task-text{flex:1;font-size:13px;line-height:1.4;color:var(--text);transition:all .3s}
.checkbox{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;position:relative}
.task-item.checked .checkbox{background:var(--red);border-color:var(--red);animation:checkPop .3s}
.task-item.checked .checkbox::after{content:'✓';color:var(--white);font-size:13px;font-weight:bold}
@keyframes checkPop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.task-list::-webkit-scrollbar{width:4px}
.task-list::-webkit-scrollbar-track{background:transparent}
.task-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.footer{border-top:1.5px solid var(--border);padding:10px 14px 12px;background:var(--white)}
.progress-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.progress-label{font-size:11px;color:var(--text2);font-weight:600}
.progress-bar{flex:1;height:6px;background:var(--red-bg2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--red-light));border-radius:3px;transition:width .3s}
.progress-text{font-size:11px;color:var(--text3);font-weight:600}
.footer-link{text-align:center}
.footer-link a{font-size:10px;color:var(--red-light);text-decoration:none;font-weight:500}
.footer-link a:hover{color:var(--red)}
.celebration{background:var(--red-bg);padding:12px;text-align:center;border-radius:10px;margin:8px 12px}
.celebration-text{font-size:13px;color:var(--red-dark);font-weight:600}
.no-data{text-align:center;padding:24px 16px;color:var(--text3);font-size:12px}
</style>
</head>

const START=new Date(2026,7,13);
const TOTAL_DAYS=40;
const WEEKDAYS=['日','一','二','三','四','五','六'];
const LS_PREFIX='dw_';

function lsKey(k){return LS_PREFIX+k;}
function lsGet(k,d){try{const v=localStorage.getItem(lsKey(k));return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(lsKey(k),JSON.stringify(v));}catch(e){}}

function getNewDay(now){
  const d=now||new Date();
  const h=d.getHours();
  const adj=h<5?new Date(d.getTime()-864e5):d;
  return new Date(adj.getFullYear(),adj.getMonth(),adj.getDate());
}

function calcDay(today){
  const diff=Math.floor((today-START)/864e5)+1;
  return Math.max(1,Math.min(diff,TOTAL_DAYS));
}

function getTaskTitle(t){
  if(t.bi!==undefined){
    const bk=RPLAN[t.bi];
    const ppd=Math.ceil(bk.p/bk.d);
    const sp=(t.bd-1)*ppd+1;
    const ep=Math.min(t.bd*ppd,bk.p);
    return t.t+' '+bk.n+'第'+sp+'-'+ep+'页';
  }else{
    return t.s?t.t+' '+t.s:t.t;
  }
}

function render(){
  const now=new Date();
  const today=getNewDay(now);
  const day=calcDay(today);
  const info=PLAN[day];
  
  if(!info){
    document.getElementById('content').innerHTML='<div class="no-data">暂无今日任务</div>';
    return;
  }
  
  const m=today.getMonth()+1;
  const d=today.getDate();
  const wd=WEEKDAYS[today.getDay()];
  
  document.getElementById('dateMain').textContent=m+'月'+d+'日';
  document.getElementById('dBadge').textContent='D'+day;
  document.getElementById('dateSub').textContent='星期'+wd;
  
  // 与主工作台保持一致：用 done_{day} 和 co_done_{day}
  const checked=lsGet('done_'+day,[]);
  const coChecked=lsGet('co_done_'+day,[]);
  const tasks=info.tasks;
  const todayTaskKeys=tasks.map(t=>t.t);
  const todayDoneKeys=checked.map(i=>todayTaskKeys[i]||'');

  // 收集延期任务
  let carryOvers=[];
  for(let prev=1;prev<day;prev++){
    const pInfo=PLAN[prev];
    if(!pInfo)continue;
    const prevDone=lsGet('done_'+prev,[]);
    if(prevDone.length>=pInfo.tasks.length)continue;
    pInfo.tasks.forEach((t,idx)=>{
      if(!prevDone.includes(idx)){
        if(todayDoneKeys.includes(t.t))return;
        carryOvers.push({task:t,fromDay:prev,idx:idx});
      }
    });
  }

  const total=tasks.length+carryOvers.length;
  const done=checked.length+coChecked.length;

  let html='<div class="task-list">';
  tasks.forEach((t,i)=>{
    const isChecked=checked.includes(i);
    const title=getTaskTitle(t);
    html+=`<div class="task-item ${isChecked?'checked':''}" onclick="toggleTask(${i})">
      <div class="task-emoji">${t.cat}</div>
      <div class="task-text">${title}</div>
      <div class="checkbox"></div>
    </div>`;
  });

  if(carryOvers.length>0){
    html+='<div style="font-size:11px;font-weight:600;color:var(--text3);padding:6px 6px 2px;letter-spacing:.3px">📦 延期任务（'+carryOvers.length+'项）</div>';
    carryOvers.forEach((co)=>{
      const key=co.fromDay+'_'+co.idx;
      const isChecked=coChecked.includes(key);
      const title=getTaskTitle(co.task);
      html+=`<div class="task-item ${isChecked?'checked':''}" onclick="toggleCoTask('${key}')">
        <div class="task-emoji">${co.task.cat}</div>
        <div class="task-text"><span style="color:#e09015;font-size:11px;font-weight:600">延期 </span>${title}</div>
        <div class="checkbox"></div>
      </div>`;
    });
  }
  html+='</div>';

  if(done===total&&total>0){
    html+='<div class="celebration"><div class="celebration-text">🎉 今日任务全部完成！太棒啦！</div></div>';
  }

  html+=`<div class="footer">
    <div class="progress-row">
      <div class="progress-label">进度</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${total>0?(done/total*100):0}%"></div></div>
      <div class="progress-text">${done}/${total}</div>
    </div>
    <div class="footer-link"><a href="https://jz197-jxh.github.io/my_workspace/" target="_blank">打开主工作台 →</a></div>
  </div>`;

  document.getElementById('content').innerHTML=html;
}

function toggleTask(idx){
  const now=new Date();
  const today=getNewDay(now);
  const day=calcDay(today);
  const checked=lsGet('done_'+day,[]);
  const pos=checked.indexOf(idx);
  if(pos===-1){
    checked.push(idx);
  }else{
    checked.splice(pos,1);
  }
  lsSet('done_'+day,checked);
  render();
}

function toggleCoTask(key){
  const now=new Date();
  const today=getNewDay(now);
  const day=calcDay(today);
  const coChecked=lsGet('co_done_'+day,[]);
  const pos=coChecked.indexOf(key);
  if(pos===-1){
    coChecked.push(key);
  }else{
    coChecked.splice(pos,1);
  }
  lsSet('co_done_'+day,coChecked);
  render();
}

render();
</script>
