<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Widget - 阅读时长</title>
<style>
:root{--red:#E74C3C;--red-light:#FF6B6B;--red-dark:#C0392B;--red-bg:#FFF5F5;--red-bg2:#FFE8E8;--text:#2D2D2D;--text2:#666;--text3:#999;--white:#FFF;--card-bg:#FFF;--border:#FFD6D6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--red-bg);color:var(--text);overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.widget{background:var(--card-bg);border-radius:16px;border:1.5px solid var(--border);width:100%;max-width:400px;padding:16px 18px;box-shadow:0 2px 12px rgba(231,76,60,.08)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.date-text{font-size:14px;font-weight:600;color:var(--text2)}
.d-tag{font-size:12px;font-weight:700;color:var(--red-dark);background:var(--red-bg2);padding:3px 10px;border-radius:12px}
.timer-section{text-align:center;padding:16px 0 12px}
.timer-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.timer-display{font-size:52px;font-weight:800;color:var(--red);font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1.1}
.timer-unit{font-size:14px;color:var(--text3);margin-top:4px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:all .15s;letter-spacing:0.5px;margin:12px 0}
.btn-start{background:linear-gradient(135deg,var(--red),var(--red-dark));color:var(--white)}
.btn-start:active{transform:scale(.97);opacity:.9}
.btn-pause{background:var(--red-bg2);color:var(--red-dark)}
.btn-pause:active{transform:scale(.97)}
.stats{display:flex;gap:10px;margin-top:12px}
.stat-card{flex:1;background:var(--red-bg);border-radius:10px;padding:10px;text-align:center}
.stat-val{font-size:20px;font-weight:800;color:var(--red)}
.stat-label{font-size:11px;color:var(--text3);margin-top:2px}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot-off{background:var(--text3)}
.dot-on{background:#2ecc71;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status-bar{text-align:center;font-size:11px;color:var(--text3);margin-top:8px}
</style>
</head>
<body>
<div class="widget">
  <div class="top">
    <span class="date-text" id="dateText">--</span>
    <span class="d-tag" id="dTag">D--</span>
  </div>
  <div class="timer-section">
    <div class="timer-label">今日阅读时长</div>
    <div class="timer-display" id="timerDisplay">00:00</div>
    <div class="timer-unit" id="timerUnit">分钟</div>
  </div>
  <button class="btn btn-start" id="mainBtn" onclick="toggleTimer()">📖 开始阅读</button>
  <div class="status-bar"><span class="status-dot dot-off" id="statusDot"></span><span id="statusText">未开始</span></div>
  <div class="stats">
    <div class="stat-card">
      <div class="stat-val" id="sessionCount">0</div>
      <div class="stat-label">今日次数</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="totalDays">0</div>
      <div class="stat-label">累计天数</div>
    </div>
  </div>
</div>
<script>
const START=new Date(2026,7,13);
const WEEKDAYS=['日','一','二','三','四','五','六'];
let startTime=null;
let timerInterval=null;
let todayTotal=0;
let sessions=0;
let isRunning=false;

function getNewDay(){
  const d=new Date();
  const h=d.getHours();
  const adj=h<5?new Date(d.getTime()-864e5):d;
  return new Date(adj.getFullYear(),adj.getMonth(),adj.getDate());
}
function getDayStr(d){
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}
function calcD(today){
  const diff=Math.floor((today-START)/864e5)+1;
  return Math.max(1,diff);
}
function formatTime(sec){
  const m=Math.floor(sec/60);
  const s=sec%60;
  if(m>=60){
    const h=Math.floor(m/60);
    const rm=m%60;
    return h+'时'+String(rm).padStart(2,'0')+'分';
  }
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function displayTime(sec){
  const m=Math.floor(sec/60);
  const s=sec%60;
  document.getElementById('timerDisplay').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  if(m<1)document.getElementById('timerUnit').textContent='秒: '+sec+'秒';
  else if(m<60)document.getElementById('timerUnit').textContent=m+'分钟'+s+'秒';
  else document.getElementById('timerUnit').textContent=Math.floor(m/60)+'时'+m%60+'分';
}
function loadData(){
  const today=getNewDay();
  const key='rw_reading_'+getDayStr(today);
  try{
    const data=JSON.parse(localStorage.getItem(key));
    if(data&&data.date===getDayStr(today)){
      todayTotal=data.total||0;
      sessions=data.sessions||0;
    }else{
      todayTotal=0;sessions=0;
    }
  }catch(e){todayTotal=0;sessions=0;}
  displayTime(todayTotal);
  document.getElementById('sessionCount').textContent=sessions;
  loadTotalDays();
}
function saveData(){
  const today=getNewDay();
  const key='rw_reading_'+getDayStr(today);
  localStorage.setItem(key,JSON.stringify({date:getDayStr(today),total:todayTotal,sessions:sessions}));
}
function loadTotalDays(){
  let count=0;
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.startsWith('rw_reading_')){
      try{
        const d=JSON.parse(localStorage.getItem(k));
        if(d&&d.total>0)count++;
      }catch(e){}
    }
  }
  document.getElementById('totalDays').textContent=count;
}
function updateDate(){
  const today=getNewDay();
  const m=today.getMonth()+1;
  const d=today.getDate();
  const wd=WEEKDAYS[today.getDay()];
  document.getElementById('dateText').textContent=m+'月'+d+'日 周'+wd;
  document.getElementById('dTag').textContent='D'+calcD(today);
}
function toggleTimer(){
  if(isRunning){
    pauseTimer();
  }else{
    startTimer();
  }
}
function startTimer(){
  isRunning=true;
  startTime=Date.now();
  document.getElementById('mainBtn').className='btn btn-pause';
  document.getElementById('mainBtn').textContent='⏸ 暂停阅读';
  document.getElementById('statusDot').className='status-dot dot-on';
  document.getElementById('statusText').textContent='阅读中...';
  timerInterval=setInterval(function(){
    const elapsed=Math.floor((Date.now()-startTime)/1000);
    displayTime(todayTotal+elapsed);
  },1000);
}
function pauseTimer(){
  if(startTime){
    todayTotal+=Math.floor((Date.now()-startTime)/1000);
    sessions++;
    clearInterval(timerInterval);
    startTime=null;
    saveData();
  }
  isRunning=false;
  document.getElementById('mainBtn').className='btn btn-start';
  document.getElementById('mainBtn').textContent='📖 开始阅读';
  document.getElementById('statusDot').className='status-dot dot-off';
  document.getElementById('statusText').textContent='已暂停';
  document.getElementById('sessionCount').textContent=sessions;
  displayTime(todayTotal);
}
updateDate();
loadData();
setInterval(function(){
  const today=getNewDay();
  const key='rw_reading_'+getDayStr(today);
  const cur=document.getElementById('dateText').textContent;
  const m=today.getMonth()+1;
  const d=today.getDate();
  const wd=WEEKDAYS[today.getDay()];
  const newText=m+'月'+d+'日 周'+wd;
  if(cur!==newText){
    updateDate();
    if(!isRunning)loadData();
  }
},60000);
</script>
</body>
</html>
