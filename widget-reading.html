<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Widget - 阅读进度</title>
<style>
:root{
  --red:#E74C3C;--red-l:#FF6B6B;--red-d:#C0392B;
  --bg:#FFF5F3;--bg2:#FFEBE7;--bg3:#FFD6CF;
  --white:#FFF;--text:#2D2D2D;--text2:#7A5C58;--text3:#B59A94;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Hiragino Sans GB',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px;
}
.widget{
  background:var(--white);border-radius:16px;width:100%;max-width:300px;
  padding:14px 14px 12px;
  border:1.5px solid var(--bg3);
  box-shadow:0 2px 12px rgba(231,76,60,.06);
}
/* 顶栏 */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.date-text{font-size:11.5px;font-weight:600;color:var(--text2)}
.d-tag{
  font-size:10px;font-weight:800;color:var(--white);
  background:linear-gradient(135deg,var(--red),var(--red-d));
  padding:2px 9px;border-radius:8px;
}
/* 核心数字 */
.core{text-align:center;padding:4px 0 8px}
.pages-line{display:flex;align-items:baseline;justify-content:center;gap:2px}
.pages-done{font-size:34px;font-weight:900;color:var(--red);line-height:1.1}
.pages-sep{font-size:14px;font-weight:600;color:var(--text3);margin:0 1px}
.pages-total{font-size:14px;font-weight:700;color:var(--text3)}
.pages-unit{font-size:11px;font-weight:600;color:var(--text3);margin-left:2px}
/* 百分比 */
.pct-row{font-size:12px;color:var(--text2);margin:2px 0 8px;text-align:center}
.pct-val{font-weight:700;color:var(--red-d)}
/* 进度条 */
.bar-outer{width:100%;height:10px;background:var(--bg2);border-radius:5px;overflow:hidden}
.bar-fill{
  height:100%;border-radius:5px;
  background:linear-gradient(90deg,var(--red-l),var(--red));
  transition:width .8s cubic-bezier(.22,1,.36,1);min-width:3px;
}
/* 底部信息 */
.bottom{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.streak{font-size:12px;color:var(--text2);font-weight:600}
.streak span{color:var(--red);font-size:16px;font-weight:800}
.book{font-size:11px;color:var(--text3);max-width:55%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 打卡 */
.footer{margin-top:10px;text-align:center}
.footer-checked{font-size:11.5px;color:#27ae60;font-weight:600}
.footer-btn{
  display:inline-block;font-size:11.5px;color:var(--white);
  background:linear-gradient(135deg,var(--red-l),var(--red));
  padding:6px 16px;border-radius:10px;text-decoration:none;font-weight:700;
}
/* 无数据 */
.no-data{text-align:center;padding:24px 10px;color:var(--text3);font-size:12px;line-height:2}
</style>
</head>
<body>
<div class="widget">
  <div class="top">
    <span class="date-text" id="dateText">--</span>
    <span class="d-tag" id="dTag">D--</span>
  </div>
  <div id="mainContent"></div>
</div>
<script>
var START=new Date(2026,7,13);
var WEEKDAYS=['日','一','二','三','四','五','六'];
var RPLAN=[
  {n:'《蛇结》',d:4,p:380},
  {n:'《赫索格》',d:11,p:979},
  {n:'《我弥留之际》',d:5,p:447}
];

function getNewDay(){
  var d=new Date(),h=d.getHours();
  var adj=h<5?new Date(d.getTime()-864e5):d;
  return new Date(adj.getFullYear(),adj.getMonth(),adj.getDate());
}
function calcD(today){return Math.max(1,Math.floor((today-START)/864e5)+1)}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function getGoal(){
  var goals=[];
  try{goals=JSON.parse(localStorage.getItem('dw_goals')||'[]')}catch(e){}
  for(var i=0;i<goals.length;i++) if(goals[i].id==='reading') return goals[i];
  return null;
}
function getCurrentBook(dNum){
  var cum=0;
  for(var i=0;i<RPLAN.length;i++){
    cum+=RPLAN[i].d;
    if(dNum<=cum) return RPLAN[i].n;
  }
  return null;
}

function render(){
  var rg=getGoal();
  var box=document.getElementById('mainContent');
  if(!rg){
    box.innerHTML='<div class="no-data">请先打开工作台初始化数据</div>';
    return;
  }
  var done=rg.done||0, total=rg.total||1806, streak=rg.streak||0, lastDate=rg.lastDate||'';
  var today=getNewDay(), dNum=calcD(today), todayStr=fmtDate(today);
  var pct=total>0?Math.min(100,Math.round(done/total*100)):0;
  var book=getCurrentBook(dNum);

  var footerHtml;
  if(lastDate===todayStr){
    footerHtml='<div class="footer"><span class="footer-checked">✅ 今日已打卡</span></div>';
  } else {
    footerHtml='<div class="footer"><a class="footer-btn" href="https://jz197-jxh.github.io/my_workspace/">去打卡 →</a></div>';
  }

  box.innerHTML=
    '<div class="core">'+
      '<div class="pages-line">'+
        '<span class="pages-done">'+done+'</span>'+
        '<span class="pages-sep">/</span>'+
        '<span class="pages-total">'+total+'</span>'+
        '<span class="pages-unit">页</span>'+
      '</div>'+
      '<div class="pct-row">'+pct+'%</div>'+
      '<div class="bar-outer"><div class="bar-fill" style="width:'+pct+'%"></div></div>'+
    '</div>'+
    '<div class="bottom">'+
      '<div class="streak">🔥 <span>'+streak+'</span>天</div>'+
      '<div class="book">'+(book||'全部读完 🎉')+'</div>'+
    '</div>'+
    footerHtml;
}

function updateHeader(){
  var today=getNewDay(),m=today.getMonth()+1,d=today.getDate(),wd=WEEKDAYS[today.getDay()];
  document.getElementById('dateText').textContent=m+'月'+d+'日 周'+wd;
  document.getElementById('dTag').textContent='D'+calcD(today);
}

updateHeader();
render();

setInterval(function(){
  var today=getNewDay(),m=today.getMonth()+1,d=today.getDate(),wd=WEEKDAYS[today.getDay()];
  var t=m+'月'+d+'日 周'+wd;
  if(document.getElementById('dateText').textContent!==t){updateHeader();render()}
},60000);
</script>
</body>
</html>
