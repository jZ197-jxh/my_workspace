<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Widget - 阅读进度</title>
<style>
:root{--red:#E74C3C;--red-light:#FF6B6B;--red-dark:#C0392B;--red-bg:#FFF5F5;--red-bg2:#FFE8E8;--text:#2D2D2D;--text2:#666;--text3:#999;--white:#FFF;--card-bg:#FFF;--border:#FFD6D6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--red-bg);color:var(--text);overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.widget{background:var(--card-bg);border-radius:16px;border:1.5px solid var(--border);width:100%;max-width:400px;padding:16px 18px;box-shadow:0 2px 12px rgba(231,76,60,.08)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.date-text{font-size:14px;font-weight:600;color:var(--text2)}
.d-tag{font-size:12px;font-weight:700;color:var(--red-dark);background:var(--red-bg2);padding:3px 10px;border-radius:12px}
.title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:12px}
.progress-core{text-align:center;padding:14px 0 10px}
.pages-display{font-size:28px;font-weight:800;color:var(--red);line-height:1.2}
.pages-display .total{color:var(--text3);font-weight:600;font-size:22px}
.pages-display .unit{font-size:16px;color:var(--text3);font-weight:600;margin-left:2px}
.pct{font-size:42px;font-weight:900;color:var(--red);margin:6px 0 10px;letter-spacing:-1px}
.bar-wrap{width:100%;height:14px;background:var(--red-bg2);border-radius:7px;overflow:hidden}
.bar-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--red-light),var(--red),var(--red-dark));transition:width .6s ease;min-width:2px}
.stats{display:flex;gap:8px;margin-top:14px}
.stat-card{flex:1;background:var(--red-bg);border-radius:10px;padding:10px 8px;text-align:center}
.stat-val{font-size:18px;font-weight:800;color:var(--red)}
.stat-label{font-size:11px;color:var(--text3);margin-top:2px;line-height:1.3}
.book-row{margin-top:10px;background:var(--red-bg);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px}
.book-icon{font-size:18px}
.book-info{flex:1}
.book-name{font-size:14px;font-weight:700;color:var(--text)}
.book-hint{font-size:11px;color:var(--text3);margin-top:1px}
.footer{margin-top:12px;text-align:center}
.footer-checked{font-size:13px;color:#27ae60;font-weight:600}
.footer-link{display:inline-block;font-size:13px;color:var(--white);background:linear-gradient(135deg,var(--red),var(--red-dark));padding:8px 18px;border-radius:10px;text-decoration:none;font-weight:600;transition:opacity .15s}
.footer-link:active{opacity:.8}
.no-data{text-align:center;padding:30px 10px;color:var(--text3);font-size:14px;line-height:1.8}
</style>
</head>
<body>
<div class="widget" id="widgetBox">
  <div class="top">
    <span class="date-text" id="dateText">--</span>
    <span class="d-tag" id="dTag">D--</span>
  </div>
  <div class="title">📕 阅读进度</div>
  <div id="mainContent"></div>
</div>
<script>
var START=new Date(2026,7,13);
var WEEKDAYS=['日','一','二','三','四','五','六'];

var RPLAN=[
  {n:'\u300A\u86C7\u7ED3\u300B',d:4,p:380},
  {n:'\u300A\u8D6B\u7D22\u683C\u300B',d:11,p:979},
  {n:'\u300A\u6211\u5F25\u7559\u4E4B\u9645\u300B',d:5,p:447}
];

function getNewDay(){
  var d=new Date();
  var h=d.getHours();
  var adj=h<5?new Date(d.getTime()-864e5):d;
  return new Date(adj.getFullYear(),adj.getMonth(),adj.getDate());
}

function calcD(today){
  var diff=Math.floor((today-START)/864e5)+1;
  return Math.max(1,diff);
}

function fmtDate(d){
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}

function getCurrentBook(dNum){
  var cum=0;
  for(var i=0;i<RPLAN.length;i++){
    cum+=RPLAN[i].d;
    if(dNum<=cum) return {name:RPLAN[i].n,phase:i+1,totalDays:cum};
  }
  return null;
}

function calcDailyAvg(dNum,totalPages){
  if(dNum<=1) return totalPages;
  var done=getDonePages();
  var remaining=totalPages-done;
  var daysLeft=20-dNum+1;
  if(daysLeft<=0) return 0;
  return Math.ceil(remaining/daysLeft);
}

function getDonePages(){
  var goals=[];
  try{goals=JSON.parse(localStorage.getItem('dw_goals')||'[]');}catch(e){}
  var rg=null;
  for(var i=0;i<goals.length;i++){
    if(goals[i].id==='reading'){rg=goals[i];break;}
  }
  return rg?rg.done:0;
}

function updateDate(){
  var today=getNewDay();
  var m=today.getMonth()+1;
  var d=today.getDate();
  var wd=WEEKDAYS[today.getDay()];
  document.getElementById('dateText').textContent=m+'月'+d+'日 周'+wd;
  document.getElementById('dTag').textContent='D'+calcD(today);
}

function render(){
  var goals=[];
  try{goals=JSON.parse(localStorage.getItem('dw_goals')||'[]');}catch(e){}
  var rg=null;
  for(var i=0;i<goals.length;i++){
    if(goals[i].id==='reading'){rg=goals[i];break;}
  }

  var box=document.getElementById('mainContent');
  if(!rg){
    box.innerHTML='<div class="no-data">📭 请先打开工作台初始化数据<br><span style="font-size:12px">访问 jz197-jxh.github.io/my_workspace/</span></div>';
    return;
  }

  var done=rg.done||0;
  var total=rg.total||1806;
  var streak=rg.streak||0;
  var lastDate=rg.lastDate||'';
  var today=getNewDay();
  var dNum=calcD(today);
  var todayStr=fmtDate(today);
  var pct=total>0?Math.round(done/total*100):0;
  if(pct>100) pct=100;

  var book=getCurrentBook(dNum);
  var dailyAvg=calcDailyAvg(dNum,total);

  var bookHtml='';
  if(book){
    bookHtml='<div class="book-row"><span class="book-icon">📚</span><div class="book-info"><div class="book-name">当前在读：'+book.n+'</div><div class="book-hint">阶段 '+book.phase+'/3</div></div></div>';
  }else{
    bookHtml='<div class="book-row"><span class="book-icon">📚</span><div class="book-info"><div class="book-name">暂无阅读任务</div><div class="book-hint">所有计划已完成 🎉</div></div></div>';
  }

  var footerHtml='';
  if(lastDate===todayStr){
    footerHtml='<div class="footer"><span class="footer-checked">✅ 今日已打卡</span></div>';
  }else{
    footerHtml='<div class="footer"><a class="footer-link" href="https://jz197-jxh.github.io/my_workspace/">今天阅读了吗？去工作台打卡 →</a></div>';
  }

  box.innerHTML=
    '<div class="progress-core">'+
      '<div class="pages-display">'+done+' <span class="total">/ '+total+'</span><span class="unit"> 页</span></div>'+
      '<div class="pct">'+pct+'%</div>'+
      '<div class="bar-wrap"><div class="bar-fill" style="width:'+pct+'%"></div></div>'+
    '</div>'+
    '<div class="stats">'+
      '<div class="stat-card"><div class="stat-val">🔥 '+streak+'</div><div class="stat-label">连续打卡 天</div></div>'+
      '<div class="stat-card"><div class="stat-val">📖 '+dailyAvg+'</div><div class="stat-label">今日建议 页/天</div></div>'+
    '</div>'+
    bookHtml+
    footerHtml;
}

updateDate();
render();

setInterval(function(){
  var today=getNewDay();
  var m=today.getMonth()+1;
  var d=today.getDate();
  var wd=WEEKDAYS[today.getDay()];
  var newText=m+'月'+d+'日 周'+wd;
  var cur=document.getElementById('dateText').textContent;
  if(cur!==newText){
    updateDate();
    render();
  }
},60000);
</script>
</body>
</html>
